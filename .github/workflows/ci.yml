name: CI
on:
  push:
    branches: [main, feature/ai-engineering-only]
  pull_request:
    branches: [main, feature/liquid-glass-portfolio]
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test -- --watchAll=false
      - name: Production build
        run: npm run build