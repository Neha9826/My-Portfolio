name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test -- --watchAll=false
      - name: Production build
        # CRA currently reports pre-existing lint/CSS warnings as build errors when CI=true.
        # Keep the build check useful while keeping those warnings visible in the logs.
        env:
          CI: "false"
        run: npm run build